!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Post Profile Page</title>
    <link rel="stylesheet" href="TradingPost.css">
    <link rel="icon" href="./images/logo.png" type="image/x-icon">
</head>
<body>
    <div id="wrapper">
        <header id="banner">
            <div id="banner_wraps">
                <a href="Index.html"><img id="left_content_img" src="images/logo.png" width="50px" height="50px" alt="Main Icon"></a>
                <h1>The Trading Post</h1>
                <div id="search_container">
                    <input type="text" id="search_bar" placeholder="Seek Out Goods...">
                </div>
                <img id="cart_image" src="images/pouch.png" width="50px" height="50px" alt="Cart Icon">
                <a href="Profile.html" id="profile_link">
                    <img id="right_content_img" src="images/SkullProfile.jpg" width="50px" height="50px" alt="Profile Icon">
                </a>
            </div>
        </header>

        <main>
            <div id="product_page_container">
                <div id="product_image_container">
                    <img id="product_image" src="images/SkullProfile.jpg" width="360px" height="360px" alt="Profile Image">
                </div>
                <div id="product_info_container">
                    <h2>Antonio Frankfern</h2>
                    <p id="user_name">Farmer</p>
                    <p id="description">Description of you. Talk about what you like doing, or your job.</p>
                    <button id="create_listing">Create Listing</button>
                    <button id="account_options">Account Options</button>
                    <button id="sign_out">Sign Out</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const username = urlParams.get("username");

                const response = await fetch(`http://localhost:3000/profile/${username}`);
                const userProfile = await response.json();

                document.querySelector("#product_image").src = userProfile.iconPath;
                document.querySelector("h2").textContent = userProfile.username;
                document.querySelector("#user_name").textContent = userProfile.role;
                document.querySelector("#description").textContent = userProfile.description;
            } catch (error) {
                console.error("Failed to load user profile:", error);
            }
        });
    </script>
</body>
</html>
