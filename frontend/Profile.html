<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Trading Post Profile Page</title>
    <link rel="stylesheet" href="TradingPost.css">
    <link rel="icon" href="./images/logo.png" type="image/x-icon">
</head>

<body>
    <div id="wrapper">
        <header id="banner">
            <div id="banner_wraps">
                <a href="Index.html"><img id="left_content_img" src="images/logo.png" width="50" height="50"
                        alt="Main Icon"></a>
                <h1>The Trading Post</h1>

                <a href="Pouch.html" id="cart_link">
                    <img src="images/pouch.png" width="50px" height="50px" alt="Cart Icon">
                </a>
                <a href="Profile.html" id="profile_link">
                    <img id="right_content_img" src="images/SkullProfile.jpg" width="50" height="50" alt="Profile Icon">
                </a>
            </div>
        </header>

        <main>
            <div id="product_page_container">
                <div id="product_image_container">
                    <img id="product_image" src="images/SkullProfile.jpg" width="360" height="360" alt="Profile Image">
                </div>
                <div id="product_info_container">
                    <h2 id="username">Guest</h2>
                    <p id="user_name">No Role</p>
                    <p id="user_description">You have not input a description for your account</p>

                    <a href="ProductListing.html" class="button-link">Create Listing</a>
                    <a href="Login.html" class="button-link">Create Account</a>
                    <button id="sign_out">Sign Out</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem("loggedInUser"));
            const profileImg = document.getElementById("right_content_img");

            if (user && profileImg) {
                profileImg.src = user.icon || "images/SkullProfile.jpg";
                profileImg.alt = `${user.username}'s Profile Icon`;
            }
        });
        document.addEventListener("DOMContentLoaded", () => {
            const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

            if (loggedInUser) {
                document.querySelector("#product_image").src = loggedInUser.icon || "images/SkullProfile.jpg";
                document.querySelector("#product_image").alt = `${loggedInUser.username}'s Profile Image`;
                document.querySelector("#username").textContent = loggedInUser.username;
                document.querySelector("#user_name").textContent = loggedInUser.role || "Adventurer";
                document.querySelector("#user_description").textContent = loggedInUser.description || "No description available.";
            } else {
                alert("No user logged in.");
            }

            document.getElementById("sign_out").addEventListener("click", () => {
                localStorage.removeItem("loggedInUser");
                window.location.href = "Index.html";
                document.getElementById("sign_out").addEventListener("click", () => {
                    localStorage.removeItem("loggedInUser");
                    window.location.href = "Index.html";
                });
            });

        });
    </script>
</body>

</html>
