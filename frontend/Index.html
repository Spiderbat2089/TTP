<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Trading Post Main Page</title>
    <link rel="stylesheet" href="TradingPost.css">
    <link rel="icon" href="./images/logo.png" type="image/x-icon">
</head>

<body>
    <div id="wrapper">
        <header id="banner">
            <div id="banner_wraps">
                <a href="Index.html"><img id="left_content_img" src="images/logo.png" width="50px" height="50px"
                        alt="Main Icon"></a>
                <h1>The Trading Post</h1>
                <div id="search_container">
                    <input type="text" id="search_bar" placeholder="Seek Out Goods...">
                </div>
                <a href="Pouch.html" id="cart_link">
                    <img src="images/pouch.png" width="50px" height="50px" alt="Cart Icon">
                </a>
                <a href="Profile.html" id="profile_link">
                    <img id="right_content_img" src="images/SkullProfile.jpg" width="50" height="50" alt="Profile Icon">
                  </a>
            </div>
        </header>

        <main id="product-list">

        </main>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const user = JSON.parse(localStorage.getItem("loggedInUser"));
    const profileImg = document.getElementById("right_content_img");

    if (user && profileImg) {
      profileImg.src = user.icon || "images/SkullProfile.jpg";
      profileImg.alt = `${user.username}'s Profile Icon`;
    }
});
      document.addEventListener("DOMContentLoaded", async () => {
    const searchBar = document.getElementById("search_bar");
    const container = document.getElementById("product-list");

    async function displayListings(listings) {
        container.innerHTML = ""; 

        listings.forEach(item => {
            const product = document.createElement("div");
            product.className = "product_item";

            product.innerHTML = `
                <a href="Product.html?title=${encodeURIComponent(item.title)}">
                    <!-- Inline style applied directly to img -->
                    <img src="${item.image}" style="width: 240px; height: 240px; object-fit: cover;" alt="${item.title}">
                </a>
                <a href="Product.html?title=${encodeURIComponent(item.title)}">
                    <figcaption>${item.title}<br>${item.price} Gold</figcaption>
                </a>
            `;

            container.appendChild(product);
        });
    }

    try {
        const response = await fetch("http://localhost:3000/listings");
        const listings = await response.json();
        displayListings(listings);
    } catch (error) {
        console.error("Failed to load listings:", error);
    }

    // Search bar functionality
    searchBar.addEventListener("keypress", async (e) => {
        if (e.key === "Enter") {
            const query = searchBar.value.trim();
            if (!query) return;

            try {
                const res = await fetch(`http://localhost:3000/search?q=${encodeURIComponent(query)}`);
                const results = await res.json();
                displayListings(results);
            } catch (err) {
                console.error("Search failed:", err);
            }
        }
    });
});
    </script>
</body>

</html>
