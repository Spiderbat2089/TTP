<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="TradingPost.css">
        <title>Trading Post Product Page</title>
        <meta charset="utf-8">
        <link rel="icon" type="image/x-icon" href="./images/logo.png">
    </head>
    <body>
        <div id="wrapper">
            <header id="banner">
                <div id="banner_wraps">
                    <a href="Index.html"><img id="left_content_img" src="images/logo.png" width="50px" height="50px" alt="Default Main Icon Place Holder Image"></a>
                    <h1>The Trading Post</h1>
                    <div id="search_container">
                        <input type="text" id="search_bar" placeholder="Seek Out Goods...">
                    </div>
                    <img id="cart_image" src="images/pouch.png" width="50px" height="50px" alt=""> </img>
                    <a href="Profile.html" id="profile_link"><img id="right_content_img" src="images/SkullProfile.jpg" width="50px" height="50px" alt="Default Profile Place Holder Image"></a>
                </div>
            </header>
            <main>
                <div id="product_page_container">
                    <div id="product_image_container">
                        <img id="product_image" src="images/product2.JPG" width="480px" height="480px" alt="Product 2">
                    </div>
                    <div id="product_info_container">
                        <h2>Machete-20 Gold</h2>
                        <p id="user_name">Posted By: Gerv</p>
                        <p id="description">Used to carve meat, and wasn't used for illegal activity.</p>
                        <button id="add_to_cart">Put in the Pouch</button>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
